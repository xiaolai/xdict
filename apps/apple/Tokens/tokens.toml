# R7a (WI-11, 2026-10-17): space grows with structural distance; translation < example < sense = subhead < heading =
# phrase block < part-of-speech block; a heading binds to its first line.
[density]
space-translation = { main = "0em", panel = "0em", why = "A translation sits right under what it translates (R7a)." }
space-example = { main = "0.5em", panel = "0.25em", why = "An example a half line under its sense (R7a, densities B and A)." }
space-sense = { main = "0.75em", panel = "0.5em", why = "Between senses, more than an example's gap (R7a)." }
space-subhead = { main = "0.75em", panel = "0.5em", why = "A phrase or derivative heading, at a sense's distance (R7a)." }
space-heading = { main = "1em", panel = "0.75em", why = "Before a section heading: a line (R7a)." }
space-phrase = { main = "1em", panel = "0.75em", why = "Before a phrase block, as before a heading (R7a)." }
space-pos = { main = "1.5em", panel = "1em", why = "Before a part-of-speech block, the largest structural distance (R7a)." }
space-after-heading = { main = "0.25em", why = "A heading binds to its first line (R7a); the same in both densities." }
space-image = { main = "0.75em", why = "Around an illustration, about half a line (R16); the same in both densities." }

[fill]
bp-narrow = { value = "480px", why = "A pane at most this wide (a column under about 30em) turns a float into an illustration (R16)." }
bp-wide = { value = "481px", why = "The first width past bp-narrow: a float beside text gets its space above (R16)." }
