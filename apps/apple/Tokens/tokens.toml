# XDict's design tokens for the macOS shell: the one source of every length, size, text role and colour the shell
# draws with (ADR-0003: tokens are per shell, never shared across platforms).
#
#   python3 -I Tools/tokens.py gen     writes Sources/XDictTokens/Tokens.swift and Sources/XDictEntryView/Style/tokens.css
#   python3 -I Tools/tokens.py find 12 which token has this value, or the nearest ones
#   python3 -I Tools/tokens.py add <group.name> <value> --source P.. | --why "..." | --system ...
#
# Every token carries its provenance, and the generator refuses one without: `source` (a parity id of
# Tools/parity/apple-dictionary.tsv: Apple measured it, so it is fixed), `system` (the platform's own value: a text
# style or a semantic colour, which follows the reader's settings), or `why` (XDict's own choice, said in a sentence).
# Edit by hand or with `add`, then `gen`; the generated files are never edited.
#
# [groups] declares each group: its kind (what a token of it holds), the Swift enum it becomes (none for the reading
# style's CSS groups) and one line on what it is for.

[groups]
space = { kind = "length", swift = "Space", doc = "The spacing scale: stack spacing and padding between things that belong together." }
inset = { kind = "length", swift = "Inset", doc = "Where content starts inside a pane, window or panel: fixed insets, most Apple-measured." }
row = { kind = "length", swift = "Row", doc = "Row and line heights of lists, tables and the panel." }
control = { kind = "length", swift = "Control", doc = "The sizes of controls and bars." }
motion = { kind = "number", swift = "Motion", doc = "Timings the shell runs itself: the drawer's springs and how long an undo stays offered." }
opacity = { kind = "number", swift = "Opacity", doc = "Alpha values a surface is drawn at: a card's tint and its shadow." }
card = { kind = "length", swift = "Card", doc = "A history card's own lengths: the shadow that lifts it off the glass." }
tint = { kind = "colour", swift = "Tint", doc = "The tints a history card's border takes, chosen from its own identity: the system's colours, each a tint, never a fill." }
window = { kind = "length", swift = "Window", doc = "Widths and heights of windows, panes, columns and sheets." }
radius = { kind = "length", swift = "Radius", doc = "Corner radii." }
line = { kind = "length", swift = "Line", doc = "Rule and outline widths." }
size = { kind = "size", swift = "Size", doc = "Fixed two-dimensional sizes." }
text = { kind = "font", swift = "TextRole", doc = "Text roles: a system text style where one fits, else a size Apple measured." }
colour = { kind = "colour", swift = "Colour", doc = "Colours: the system's semantic colours first; a literal only where Apple's page was measured." }
entryText = { kind = "string", swift = "EntryText", doc = "Values the entry view writes into CSS, SVG or a script as text: the reading inset, glyph strokes, the blocked image's placeholder, the popover glass measured." }
divider = { kind = "length", swift = "PageDivider", doc = "The divider between dictionaries on the All page (P15) and its compact form in the lookup popover (P41)." }
print = { kind = "length", swift = "Print", doc = "The printed entry page's section names." }
placeholder = { kind = "length", swift = "Placeholder", doc = "The picture a blocked image becomes (SVG px): its host's name in a dashed box." }
instrumentFrame = { kind = "rect", swift = "InstrumentFrame", doc = "Window frames of development instruments (the lab, the E2E instruments): never in front of a reader." }
instrumentSize = { kind = "size", swift = "InstrumentSize", doc = "Pane sizes the instruments picture an entry at." }
instrumentLength = { kind = "length", swift = "InstrumentLength", doc = "Strides, bounds and margins of the instruments' windows and captures." }
capture = { kind = "length", swift = "Capture", doc = "Capture's distances, in screen points: how far from a word a resting pointer may be, and how far it may drift and still rest (ADR-0014 decision 11). Handed into the capture targets, which may not import the tokens." }
css = { kind = "css", doc = "The reading style's tokens, as `--xdict-<name>` on :root (dev-docs/reading-style.md section 1)." }
palette = { kind = "css-palette", doc = "The reading style's palette, light then dark, as `--xdict-<name>` per theme (reading-style.md section 1.3)." }
accent = { kind = "css-accent", doc = "The accent hues the reader chooses in Settings > Reading, light then dark; `--xdict-accent` per hue." }
density = { kind = "css-density", doc = "R7a's space before a role-marked block: the main window's (B), and the lookup panel's (A) where it differs; in em, so it follows the text." }
fill = { kind = "css-fill", doc = "Values a stylesheet takes as `{{fill-<name>}}`, written in when the sheet is installed, where `var()` cannot go (a media query)." }

