[capture]
hitAcross = { value = 3, why = "How far left or right of a word's box a resting pointer may be and still mean it: one rule for every capture path, as XiaolaiDict measured word boxes from text layout, web layout and OCR disagreeing at their edges (screen-word spike, finding 7)." }
hitDown = { value = 2, why = "How far above or below a word's box a resting pointer may be and still mean it: tighter than across, since a line above or below is another word (screen-word spike, finding 7)." }
restDrift = { value = 2, why = "How far a resting pointer may drift and still be resting: a hand held on a word twitches by a point or two, and counting that as movement restarted the dwell every time (XiaolaiDict ADR-0045)." }
stripStart = { value = 300, why = "The height of the first strip the recogniser reads around the pointer's row: XiaolaiDict measured 140 reading three of five rows of a paragraph and 300 the whole of it (ADR-0016 there, 2026-10-11)." }
stripStep = { value = 150, why = "How far a strip grows on a side where its sentence ran into the edge, per read: XiaolaiDict's measured step, a taller strip costing little more than the one before (ADR-0016 there)." }
stripMost = { value = 600, why = "The tallest strip the recogniser reads, so growing stays inside the capture deadline (XiaolaiDict ADR-0016, 2026-10-11)." }
tileEdgeSlack = { value = 4, why = "In band pixels: how close to a tile's inner edge a recognised box may end and still be called cut by it, so a word on a tile boundary is read from the tile that saw it whole (XiaolaiDict ADR-0016 tiling addendum)." }
tileHoleSlack = { value = 16, why = "In band pixels: how much ink a dropped run may have seen that no kept run covers before the merged reading is called missing text (XiaolaiDict ADR-0016 tiling addendum)." }
frameDrift = { value = 1, why = "How far two readings of one window's frame, the compositor's and ScreenCaptureKit's, may disagree and still be the same frame: the two round independently (XiaolaiDict ScreenTextRecogniser)." }
labelShift = { value = 12, why = "How far from its frame's centre a control's label is assumed it may be drawn, pushed aside by an icon, a radio circle or a chevron: a chosen safety margin, not a measurement of real controls (2026-10-19; the oracle tests assume labels up to this far aside, and no control was measured), so a title's word is taken only where every placement up to this far aside agrees." }
labelSmaller = { value = 2, why = "How much smaller than the system's size for its kind a control's label is assumed it may be drawn: a chosen safety margin, not a measurement of real controls (2026-10-19; the oracle tests assume it); larger fonts are bounded by the frame the text must fit." }
