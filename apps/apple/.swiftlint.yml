# Correctness rules only, as XiaolaiDict's: style is the code's own, and SwiftLint's default rules disagree with it in
# hundreds of places, noise that would bury the findings below. A rule is added here when it finds bugs, never because
# it is on by default. An exception is made in place with `// swiftlint:disable:next <rule>` under a comment saying why
# the code is right, never by widening `excluded`.
#
# Generated/ (the UniFFI binding) is not ours to lint, and disables itself in its first line anyway.

included:
  - Sources
  - Tests

only_rules:
  - discarded_notification_center_observer
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate
  - custom_rules

custom_rules:
  # The capture suite stood still for 110 s under load (2026-10-20): fakes blocked threads of Swift's cooperative pool
  # waiting for the test that would release them, and ordering tests ran under the shipped residence bounds, which fire
  # before a slow scheduler has queued what the test meant to queue. Tests/XDictCaptureMacTests/Waiting.swift holds the
  # only sanctioned ways (Blocking, Wait, Silence, AccessibilityLane.patient); `LaneThreadTests` holds the lane's half.
  capture_tests_block_only_through_waiting:
    name: "Capture tests block and build lanes only through Waiting.swift"
    included: "Tests/XDictCaptureMacTests/.*\\.swift$"
    excluded: "Tests/XDictCaptureMacTests/Waiting\\.swift$"
    regex: "Thread\\.sleep|DispatchSemaphore|DispatchGroup|\\busleep\\(|AccessibilityLane\\s*\\{|AccessibilityLane\\(setTimeout"
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    message: "Block through Blocking.until (a lane's thread only) or Blocking.for, wait through Wait, and build a lane with AccessibilityLane.patient or named bounds (Waiting.swift)."
    severity: error
