# The macOS shell (apps/apple): the core built as its static library and Swift binding, the app and the dictionary
# service built unsigned, and `swift test` with the warnings gate. Signing, the bundle, the E2E stages and releases need
# the Developer ID and the E2E Mac, so they run on the owner's machines, not here (apps/apple/README.md).
# SwiftLint runs here at the version the gate pins (apps/apple/Makefile, SWIFTLINT_VERSION), downloaded by URL and held
# to its SHA-256, hashed from the release asset on 2026-11-05. The tool checks that need only Python and the history run
# too; the rest of `make test-tools` does not (icons-test.sh compiles and rasterises and compares the PNGs byte for byte
# with no skip mode; several tests drive ssh, the build host and the run lock), so it stays on the build Mac.
name: macos

on:
  push:
    paths:
      - apps/apple/**
      - core/**
      - conformance/**
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - apps/apple/**
      - core/**
      - conformance/**
      - .github/workflows/macos.yml

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.99.0
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: apps/apple

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The style ledger's check proves each fixed row's commit exists: a shallow clone has none of them.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      # The package's floor is macOS 27 and its binaries are arm64 alone (macOS 27 runs only on Apple silicon): a
      # runner without that SDK or that architecture cannot build it, and says so here rather than in a compiler error.
      - name: the toolchain can build for macOS 27 on arm64
        run: |
          swift --version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk on $(uname -m)"
          [ "$(uname -m)" = arm64 ] || { echo "::error::this runner is $(uname -m); the shell builds for arm64 alone"; exit 1; }
          [ "${sdk%%.*}" -ge 27 ] || { echo "::error::macOS SDK $sdk; the package needs 27 or later (select a newer Xcode)"; exit 1; }
      # The token system and the style ledger (AGENTS.md): generated tokens current, no literal design value, every fixed
      # ledger row with its guard and its commit.
      - name: tokens and the style ledger
        run: |
          python3 -I Tools/tokens.py gen --check
          python3 -I Tools/tokens.py check
          python3 -I Tools/gallery/ledger.py check
      # The pinned SwiftLint, never the runner's or Homebrew's: a different version is a different rule set.
      - name: SwiftLint ${{ env.SWIFTLINT_VERSION }}, pinned and verified
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c -
          mkdir swiftlint && unzip -q swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >>"$GITHUB_PATH"
      # Tools/not-on-air.sh refuses a Mac whose model it cannot read; a hosted runner is named here, not guessed.
      - name: make lint
        env:
          XDICT_HW_MODEL: GitHub-hosted runner
        run: make lint
      - name: the core, as the shell links it
        run: Tools/build-core.sh
      - name: the app and the dictionary service, unsigned
        run: swift build -c release --product XDict && swift build -c release --product XDictService
      # Written by the core's own MDX writer (conformance/ and the slow fixtures), read by the service's tests.
      - name: the service's test fixtures
        run: Tools/build-fixtures.sh "$PWD/.build/fixtures"
      - name: swift test, then every compiled source's diagnostics
        run: |
          status=0
          swift test || status=1
          python3 Tools/compiler-warnings.py .build/out/Intermediates.noindex/XDict.build/Debug || status=1
          exit $status
