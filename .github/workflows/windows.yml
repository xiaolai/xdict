name: windows

# apps/windows: the service, the solution and the non-GUI gates. UI and E2E never run here: a hosted runner has no
# desktop session (ADR-0004). The launch stage runs on the Windows E2E host, on request (Tools/launch.ps1).

on:
  push:
    paths:
      - "apps/windows/**"
      - "apps/apple/Sources/XDictEntryView/Style/**"
      - "apps/apple/Resources/Fonts/**"
      - "core/**"
      - "conformance/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "apps/apple/Sources/XDictEntryView/Style/**"
      - "apps/apple/Resources/Fonts/**"
      - "core/**"
      - "conformance/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.99.0"
          # test.ps1 runs cargo fmt --check and cargo clippy; the minimal profile has neither.
          components: rustfmt, clippy

      # The same gate scripts the landing runs, never a second copy of their steps: the two used to drift.
      - name: Build
        run: ./Tools/build.ps1

      # test.ps1 sets XDICT_SERVICE and XDICT_APP_OUTPUT itself; an env block here was overwritten.
      - name: Unit tests
        run: ./Tools/test.ps1

      - name: Contract fixtures
        run: ./Tools/contract.ps1

      - name: IPC conformance
        run: ./Tools/conformance.ps1
