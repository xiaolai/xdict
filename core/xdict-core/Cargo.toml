[package]
name = "xdict-core"
description = "The one API every XDict platform calls"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Serialisation for the Web binding, which passes messages as JSON.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
xdict-identity = { path = "../xdict-identity" }
xdict-lookup = { path = "../xdict-lookup" }
xdict-mdx = { path = "../xdict-mdx" }
xxhash-rust.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
xdict-mmap = { path = "../xdict-mmap" }

[dev-dependencies]
xdict-mdx-writer = { path = "../xdict-mdx-writer" }

[lints]
workspace = true
