[package]
name = "xdict-core"
description = "The one API every XDict platform calls"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Serialisation for the Web binding, which passes messages as JSON.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
xdict-entry = { path = "../xdict-entry" }
xdict-ledger = { path = "../xdict-ledger" }
xdict-health = { path = "../xdict-health" }
xdict-identity = { path = "../xdict-identity" }
xdict-lookup = { path = "../xdict-lookup" }
xdict-mdx = { path = "../xdict-mdx" }
xdict-schedule = { path = "../xdict-schedule" }
serde_json.workspace = true
xxhash-rust.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
xdict-mmap = { path = "../xdict-mmap" }

# The file index and change time Rust's stable `std` does not expose: one Win32 call, behind safe functions.
[target.'cfg(windows)'.dependencies]
xdict-win-fileid = { path = "../xdict-win-fileid" }

[dev-dependencies]
serde_json.workspace = true
xdict-mdx-writer = { path = "../xdict-mdx-writer" }

[lints]
workspace = true
