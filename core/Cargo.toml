[workspace]
resolver = "3"
members = ["xdict-mdx", "xdict-mdx-writer", "xdict-core", "xdict-conformance", "xdict-ffi", "xdict-wasm", "xdict-mmap", "xdict-identity", "xdict-lookup", "xdict-entry", "xdict-health", "xdict-schedule", "xdict-ledger", "xdict-win-fileid", "xdict-phrase", "xdict-pack"]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/xiaolai/xdict"
rust-version = "1.99"

[workspace.dependencies]
# Test-only: counts what a closure allocates, peak included, through its own global allocator; the workspace
# forbids the unsafe code one takes (`xdict-lookup/tests/unmark_memory.rs`).
allocation-counter = "=0.8.1"
encoding_rs = "=0.8.42"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
ripemd = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
uniffi = "=0.32.2"
# NFKD and NFKC for tier 2 (ADR-0007 decision 15); Unicode 17, the version `fold` was checked against.
unicode-normalization = "=0.1.25"
wasm-bindgen = "=0.2.129"
xxhash-rust = { version = "=0.8.19", default-features = false, features = ["xxh3", "xxh64"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
