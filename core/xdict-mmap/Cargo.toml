[package]
name = "xdict-mmap"
description = "Read-only memory maps of the files XDict alone writes: the one crate allowed unsafe code"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
memmap2 = "=0.9.11"

# The file index and change time, so a name that names another file between the check and the open is refused for
# the same reason on Windows as on Unix.
[target.'cfg(windows)'.dependencies]
xdict-win-fileid = { path = "../xdict-win-fileid" }

# The workspace forbids unsafe code; this crate is the exception, so it states its lints itself: unsafe is
# denied, and allowed on the one call that needs it.
[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
